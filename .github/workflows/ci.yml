name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build web bundle
        run: pnpm --filter @ration/app export:web
        env:
          EXPO_NO_TELEMETRY: '1'

  # PR previews: upload the built web bundle as a Worker VERSION (never activated in production) and
  # comment the version preview URL on the PR. Production keeps its manual `npx wrangler deploy`.
  # Needs the repo secrets CLOUDFLARE_API_TOKEN (a token with the "Edit Cloudflare Workers" template)
  # and CLOUDFLARE_ACCOUNT_ID; without them this job skips so PRs don't go red before they exist.
  preview:
    name: Cloudflare preview URL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check for the Cloudflare secrets
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set as repo secrets; skipping the preview."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
        if: steps.creds.outputs.skip != 'true'

      - name: Build web bundle
        if: steps.creds.outputs.skip != 'true'
        run: pnpm --filter @ration/app export:web
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Upload the preview version
        id: upload
        if: steps.creds.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          OUT=$(npx wrangler versions upload --message "PR #${{ github.event.pull_request.number }}: $PR_TITLE" 2>&1)
          echo "$OUT"
          # The URL only exists when Preview URLs are enabled for the worker (`preview_urls: true` in
          # wrangler.jsonc, applied by a production deploy).
          URL=$(echo "$OUT" | grep -oP 'Version Preview URL: \K\S+' || true)
          if [ -z "$URL" ]; then
            echo "::warning::No Version Preview URL in the upload output; is preview_urls enabled for the worker?"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post the preview URL on the PR
        if: steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          gh pr comment "$PR" \
            --body "Web preview of this PR: **$URL** (a Worker version preview; production is untouched). Each push updates the same comment." \
            --edit-last --create-if-none
